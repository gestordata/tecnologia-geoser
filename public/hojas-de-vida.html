<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hojas de vida · GeoSer TI</title><style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#15223b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#071a38;color:white;padding:20px 3.5%;display:flex;align-items:center;justify-content:space-between;gap:16px}a{color:#225bd6;text-decoration:none}header a{color:#b8d9ff}h1{font-size:23px;margin:0}main{max-width:1470px;margin:auto;padding:26px 3.5%}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px}button.primary{background:#1748df;color:white}button.outline{background:white;border:1px solid #dce4f0}.nav{display:flex;gap:9px;flex-wrap:wrap;margin:22px 0}.nav button.active{background:#143b94;color:#fff}.search{padding:13px 15px;border:1px solid #dce4ef;border-radius:12px;width:100%;margin-bottom:17px}.panel{background:#fff;border:1px solid #e3e8f2;border-radius:15px;overflow:hidden;box-shadow:0 9px 35px #142d5210}table{width:100%;border-collapse:collapse}td,th{padding:14px;border-bottom:1px solid #eef1f5;text-align:left;font-size:13px}th{background:#f8fafc;color:#66788f;font-size:11px;text-transform:uppercase}tbody tr{cursor:pointer}tbody tr:hover{background:#f5f8ff}.muted{color:#8090a5;font-size:12px}.pill{border-radius:20px;padding:5px 9px;background:#e9f1ff;font-size:11px;font-weight:700;color:#1848a8}.head{display:grid;grid-template-columns:125px 1fr;gap:23px;padding:26px;border-bottom:1px solid #eef1f5}.photo{width:120px;height:120px;border-radius:17px;background:linear-gradient(135deg,#102b60,#3275f5);color:white;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.head h2{margin:0;font-size:26px}.meta{display:flex;flex-wrap:wrap;gap:11px 25px;margin:17px 0}.meta div{min-width:155px}.meta span{display:block;font-size:11px;text-transform:uppercase;color:#78879b;margin-bottom:5px}.section{padding:19px 25px;border-bottom:1px solid #eef1f5}.section h3{font-size:15px;margin:0 0 15px}.rows{display:grid;gap:10px}.item{display:grid;grid-template-columns:150px 1fr;gap:15px;padding:11px 13px;background:#f8fafc;border-radius:9px;font-size:13px}.item b{color:#56677e}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:20px}.card{border:1px solid #e2e8f2;background:white;padding:19px;border-radius:14px}.card b{display:block;font-size:25px;margin-top:7px}.card span{font-size:12px;color:#7a889d}.rowbtn{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.empty{padding:35px;color:#8492a6;text-align:center}@media(max-width:750px){.cards{grid-template-columns:repeat(2,1fr)}.head{grid-template-columns:1fr}.panel{overflow:auto}table{min-width:700px}}
</style></head><body><header><div><h1>GeoSer · Tecnología</h1><div class="muted" style="color:#91afd6">Hojas de vida relacionales de activos y colaboradores</div></div><a href="/">← Inventario general</a></header><main><div class="rowbtn" style="justify-content:space-between"><h2 id="title">Hojas de vida</h2><button class="outline" onclick="back()">← Volver al listado</button></div><div id="dashboard" class="cards"></div><div class="nav"><button id="tbPeople" class="active" onclick="selectTab('people')">Colaboradores</button><button id="tbEquipment" onclick="selectTab('equipment')">Equipos</button><button id="tbReview" onclick="selectTab('review')">Pendientes por conciliar</button></div><section id="listing"><input class="search" id="search" placeholder="Buscar por nomenclatura oficial, serial, placa, colaborador..." oninput="search()"><div class="panel"><table><thead id="thead"></thead><tbody id="body"></tbody></table></div></section><section id="profile" style="display:none"></section></main><script>
const $=x=>document.getElementById(x),esc=x=>String(x??'—').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),val=x=>x==null||x===''?'—':esc(x);let tab='people',cache=[];
async function api(u,opt){const r=await fetch(u,opt);const d=await r.json();if(!r.ok)throw Error(d.error||'Error');return d}
async function start(){const s=await api('/api/profiles/summary');$('dashboard').innerHTML=[['Personas',s.people],['Activos',s.equipment],['Registros de origen',s.source_records],['Asignaciones históricas',s.asset_assignments]].map(x=>'<div class="card"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');await list()}
function selectTab(t){tab=t;$('tbPeople').classList.toggle('active',t==='people');$('tbEquipment').classList.toggle('active',t==='equipment');$('tbReview').classList.toggle('active',t==='review');$('search').value='';back();list()}
async function list(){cache=await api('/api/profiles/'+tab);render()}
function search(){render()}
function render(){const term=$('search').value.toLowerCase();const rows=cache.filter(r=>JSON.stringify(r).toLowerCase().includes(term));if(tab==='review'){$('thead').innerHTML='<tr><th>Nombre o referencia</th><th>Origen</th><th>Hoja</th><th>Fila</th><th>Estado</th></tr>';$('body').innerHTML=rows.map(r=>'<tr><td><b>'+val(r.raw_value)+'</b></td><td>'+val(r.source_file)+'</td><td>'+val(r.source_sheet)+'</td><td>'+val(r.source_row)+'</td><td><span class="pill">Pendiente de revisión</span></td></tr>').join('');return}
$('thead').innerHTML=tab==='people'?'<tr><th>Colaborador</th><th>Documento</th><th>Email</th><th>Cargo</th><th>Activos asignados</th></tr>':'<tr><th>Nomenclatura oficial</th><th>Tipo / Marca</th><th>Serial / placa</th><th>Estado</th><th>Responsable</th></tr>';
$('body').innerHTML=rows.slice(0,800).map(r=>tab==='people'?'<tr onclick="openProfile('+r.id+')"><td><b>'+val(r.name)+'</b></td><td>'+val(r.cedula)+'</td><td>'+val(r.email)+'</td><td>'+val(r.cargo)+'</td><td>'+r.equipment_count+'</td></tr>':'<tr onclick="openProfile('+r.id+')"><td><b>'+val(r.device_name||r.asset_tag)+'</b></td><td>'+val(r.type)+' · '+val(r.brand)+'</td><td>'+val(r.serial)+'</td><td><span class="pill">'+val(r.status)+'</span></td><td>'+val(r.assigned_to)+'</td></tr>').join('')||'<tr><td colspan="5" class="empty">Sin resultados</td></tr>'}
function field(k,v){return '<div><span>'+esc(k)+'</span><b>'+val(v)+'</b></div>'}
function tile(k,v){return '<div class="item"><b>'+esc(k)+'</b><div>'+val(v)+'</div></div>'}
async function openProfile(id){const d=await api('/api/profiles/'+tab+'/'+id),p=d.profile;$('listing').style.display='none';$('profile').style.display='block';$('dashboard').style.display='none';document.querySelector('.nav').style.display='none';$('title').textContent='Hoja de vida '+(tab==='people'?'del colaborador':'del equipo');let header='',sections='';
const phot=p.photo?'<img src="/profile-photos/'+encodeURIComponent(p.photo)+'">':(tab==='people'?'👤':'💻');
if(tab==='people'){
 header='<h2>'+val(p.name)+'</h2><div class="meta">'+field('Documento',p.cedula)+field('Correo corporativo',p.email)+field('Cargo',p.cargo)+field('Área / costos',p.cost_center)+field('Teléfono',p.phone)+'</div>';
 sections='<div class="section"><h3>Equipos asignados actualmente ('+d.current_equipment.length+')</h3>'+(d.current_equipment.map(e=>tile(e.asset_tag,e.type+' · '+(e.serial||'sin serial'))).join('')||'<p class="muted">No tiene equipos asociados actualmente.</p>')+'</div>';
}else{
 header='<h2>'+val(p.device_name||p.asset_tag)+' · '+val(p.type)+'</h2><div class="meta">'+field('Nomenclatura oficial',p.device_name)+field('Placa interna',p.asset_tag)+field('Serial',p.serial)+field('Marca',p.brand)+field('Modelo',p.model)+field('Estado',p.status)+field('Responsable',d.assignments.length?d.assignments[0].person_name:'Ver asignaciones')+'</div>';
 sections='<div class="section"><h3>Características y administración</h3><div class="rows">'+[['Hostname',p.device_name],['Sistema operativo',p.os],['Bitdefender',p.antivirus],['Renting',p.renting],['Centro de costos',p.cost_center],['Ubicación',p.location],['IMEI',p.imei1],['RAM',p.ram],['Procesador',p.processor],['Almacenamiento',p.storage],['Observaciones',p.notes]].map(x=>tile(...x)).join('')+'</div></div>';
}
sections+='<div class="section"><h3>Historial de asignaciones ('+d.assignments.length+')</h3><div class="rows">'+(d.assignments.map(a=>tile(a.asset_tag+' · '+(a.serial||'sin serial'),(a.person_name||a.recipient_raw||'Sin identificar')+' | '+(a.started_at||'Fecha pendiente')+' | '+a.status)).join('')||'<p class="muted">No hay asignaciones históricas vinculadas aún.</p>')+'</div></div>';
sections+='<div class="section"><h3>Actas y movimientos vinculados ('+d.movements.length+')</h3><div class="rows">'+(d.movements.map(m=>tile(m.movement_date+' · Caso '+(m.case_no||m.id),m.action+' · '+(m.asset_tag||m.person_name||'')+' · '+(m.category||'')+' · <a href=\"/?act='+m.id+'\" target=\"_blank\">Ver acta</a>')).join('')||'<p class="muted">No existen actas enlazadas por identificador.</p>')+'</div></div>';
sections+='<div class="section"><h3>Fuentes y trazabilidad ('+d.sources.length+')</h3><div class="rows">'+(d.sources.map(s=>tile(s.source_file,s.source_sheet+' · fila '+s.source_row+' · '+s.matching_method)).join('')||'<p class="muted">No hay registros de fuente cruzados todavía.</p>')+'</div></div>';
$('profile').innerHTML='<div class="panel"><div class="head"><div><div class="photo" id="photo">'+phot+'</div><label style="font-size:11px;display:block;margin-top:9px;color:#4669a9;cursor:pointer">Cambiar foto<input type="file" accept="image/png,image/jpeg,image/webp" style="display:none" onchange="upload(this,'+id+')"></label></div><div>'+header+'</div></div>'+sections+'</div>';
}
async function upload(input,id){const file=input.files[0];if(!file)return;if(file.size>3000000)return alert('La foto debe pesar máximo 3 MB');const reader=new FileReader();reader.onload=async()=>{try{await api('/api/profiles/'+tab+'/'+id+'/photo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({data:reader.result})});await openProfile(id)}catch(e){alert(e.message)}};reader.readAsDataURL(file)}
function back(){$('listing').style.display='block';$('profile').style.display='none';$('dashboard').style.display='grid';document.querySelector('.nav').style.display='flex';$('title').textContent='Hojas de vida'}
start().catch(e=>{$('body').innerHTML='<tr><td>'+esc(e.message)+'</td></tr>'})
</script></body></html>
